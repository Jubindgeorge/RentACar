name: RentACar checks

on:
  push:
    branches: [main, sub]
  pull_request:
    branches: [main, sub]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check bin/www
          node --check config/config.js
          node --check routes/index.js
          node --check routes/users.js
          node --check routes/api.js
          node --check middleware/requireAdmin.js
          node --check Models/userModel.js
          node --check Models/carModel.js
          node --check Models/bookingModel.js
          node --check Models/loginActivityModel.js
      - name: Check inline page JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source, target in [('views/user/fleet.hbs', '/tmp/fleet-inline.js'), ('views/admin/dashboard.hbs', '/tmp/admin-inline.js')]:
              html = Path(source).read_text()
              scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
              Path(target).write_text('\n'.join(scripts))
          PY
          node --check /tmp/fleet-inline.js
          node --check /tmp/admin-inline.js
